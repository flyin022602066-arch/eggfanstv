                username: { type: string }
                password: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /projects:
    get:
      tags: [projects]
      summary: 短剧项目列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建短剧项目
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /resources:
    get:
      tags: [resources]
      summary: 当前用户资源列表
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
    post:
      tags: [resources]
      summary: 上传资源文件
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "403":
          description: 配额用尽（code=40301, reason=quota_exceeded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resources/suno-media:
    post:
      tags: [resources]
      summary: 取回已生成的 Suno 音频或歌曲视频
      description: 只下载原结果并保存为当前用户的本地资源，不提交创作。按幂等标识和 clipId 复用本地文件，校验真实媒体内容、大小和 SSRF 出口；不向媒体站传递 API Key 或本地凭据。
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, clipId, kind]
              properties:
                url: { type: string, format: uri, maxLength: 8192 }
                clipId: { type: string, minLength: 1, maxLength: 256 }
                kind: { type: string, enum: [audio, video] }
                durationMs: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /resources/{id}:
    get:
      tags: [resources]
      summary: 读取当前用户资源信息与临时图片上传状态
      description: 信封 data.resource 可包含 temporaryImageUrl、temporaryImageUploadedAt、temporaryImageExpiresAt。失效时间为 Uguu 预计保留时间。此接口仅读取已保存状态，不上传图片或访问图床；资源归属由服务端校验。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "404":
          $ref: "#/components/responses/Error"
  /resources/{id}/playback:
    post:
      tags: [resources]
      summary: 按需准备当前用户视频预览
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/playback-cache:
    delete:
      tags: [resources]
      summary: 清理当前用户已完成的视频预览缓存
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
  /resources/{id}/file:
    get:
      tags: [resources]
      summary: 读取资源二进制（非 JSON 信封）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文件流
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/{id}/direct-url:
    get:
      tags: [resources]
      summary: 为当前用户的本地资源签发短时 HTTPS 下载 URL
      description: 要求服务器配置 CANVAS_PUBLIC_BASE_URL。链接有效期为 5 分钟，只能读取当前用户拥有的本地资源。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.url 为带有效期与签名的 HTTPS URL
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /resources/{id}/upstream-url:
    post:
      tags: [resources]
      summary: 为本地生成参考素材准备公网 HTTPS URL
      description: 校验当前用户归属和本地资源状态。已配置 CANVAS_PUBLIC_BASE_URL 时使用签名 HTTPS 地址；否则仅图片自动上传到 Uguu 临时图床，链接约 3 小时有效。原始本地资源不变，重复图片短时复用，失败不返回空地址。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.url 为生成参考素材的 HTTPS 地址
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /resources/{id}/temporary-image-url:
    post:
      tags: [resources]
      summary: 手动将当前用户的本地图片上传到 Uguu 临时图床
      description: 仅接受已保存且属于当前用户的本地图片资源，始终使用 Uguu，不受 CANVAS_PUBLIC_BASE_URL 影响。上传成功后保存临时 URL 和预计有效期，原始资源不变。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.url 为 Uguu HTTPS URL
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /public/resources/{id}/file/{filename}:
    get:
      tags: [resources]
      security: []
      summary: 读取短时签名资源 URL 指向的文件
      description: 仅接受 direct-url 签发的 expires 与 signature；桌面运行时不要求 launch token，签名有效期 5 分钟。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: filename
          required: true
          schema: { type: string }
        - in: query
          name: expires
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 资源文件流
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /timeline/render-plan:
    post:
      tags: [tasks]
      summary: 编译时间线语义渲染计划
      description: |
        只读规划：根据时间线快照与不透明源元数据返回版本化语义计划。
        不排队、不落盘、不计费，不接受 ffmpeg 参数或本地路径。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /timeline/renders:
    post:
      tags: [tasks]
      summary: 创建本机时间线渲染任务
      description: 接收时间线快照与输出选项（宽高、帧率、采样率、是否烧录字幕）。选项写入任务输入，由本机 ffmpeg 按语义计划执行。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /timeline/transcriptions:
    post:
      tags: [tasks]
      summary: 创建本机字幕转写任务
      description: 接收待转写素材编号和可选语言。只接受当前用户已上传完成的音视频。省略 model 使用本地 whisper.cpp，指定 model 使用已连接 BeefTV 账号目录中的 audio.transcriptions 模型，音轨提取后最多 25 MiB。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /depth-captures:
    post:
      tags: [tasks]
      summary: 创建本机深度动作捕捉任务
      description: 接收待处理视频素材编号。只接受当前用户已上传完成的视频。可选 clientOperationId：同一确认重复提交回读原任务。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks:
    post:
      tags: [tasks]
      summary: 创建生成任务
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/{id}:
    delete:
      tags: [assets]
      summary: 删除无业务引用的素材
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: expectedStatus
          schema: { type: string, enum: [archived] }
          description: 清空回收站时传 archived；事务内核对状态，已还原的素材返回 409 并保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          description: 无效的状态条件
        "409":
          description: 素材状态已变化或仍有业务引用，未删除
components:
  parameters:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    CharacterReferenceProfile:
      type: object
      required: [name, enabled, preferred, default]
      properties:
        lookId: { type: string, maxLength: 80, description: 空值创建新造型分组 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 4000 }
        matchHints: { type: string, maxLength: 2000 }
        excludeHints: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
        preferred: { type: boolean }
        default: { type: boolean }
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum: [400, 401, 403, 404, 409, 429, 500, 502, 503, 504, 40301, 40901, 42901]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - failed_precondition
                - quota_exceeded
                - rate_limited
                - unavailable
                - timeout
                - internal
                - local_storage_failed
                - bad_gateway
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
  responses:
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

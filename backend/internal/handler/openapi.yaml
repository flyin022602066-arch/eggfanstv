openapi: 3.0.3
info:
  title: BeefTV HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: admin
  - name: beefapi
  - name: agent-ops
  - name: assistant
  - name: creation-conversations
paths:
  /projects/{id}/characters/{assetId}/looks/extract:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: assetId, required: true, schema: { type: string } }
    post:
      tags: [projects]
      summary: 将现有组合设定拆分为独立空图造型
      description: 不调用模型。解析 looks 数组、编号造型或明确换装描述，返回 data.versions。按基础版本更新时间和角色主版本 CAS；已拆分的造型不重复创建，历史图片和镜头绑定保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersionId, expectedUpdatedAt]
              properties:
                baseVersionId: { type: string }
                expectedUpdatedAt: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { description: 未发现多套造型、设定无效或项目已归档 }
        '404': { description: 项目或角色版本不存在或不可访问 }
        '409': { description: 角色版本已变化，请刷新后重试 }
  /projects/{id}/character-versions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [projects]
      summary: 读取项目全部角色历史版本与造型目录
      description: data 为 revision 与 versions；仅返回未归档版本，每版包含 assetId、versionId、version、title、definition、representations、voice、referenceProfile、updatedAt。校验项目归属。
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '404': { description: 项目不存在或不可访问 }
  /projects/{id}/characters/{assetId}/versions/{versionId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: assetId, required: true, schema: { type: string } }
      - { in: path, name: versionId, required: true, schema: { type: string } }
    delete:
      tags: [projects]
      summary: 安全移除单个角色造型版本
      description: 仅归档版本，不删除表现、原始媒体、声音绑定或任务。允许空图和历史版本；主版本有备选时优先切换到最近有就绪图片的未归档版本，否则切换到最近未归档版本。事务内校验归属、项目活动状态、版本及主版本/备选修订，拒绝 linked 镜头、画布或排队/生成中任务引用；引用数据无法解析时拒绝删除。最后一个未归档版本须改用移除角色资产。
      parameters:
        - in: query
          name: expectedUpdatedAt
          required: true
          description: 当前目录返回的版本 updatedAt，RFC3339 日期时间，须 URL 编码；无请求体。
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 成功信封，data 为 { deleted：true }
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: { type: integer, enum: [0] }
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, enum: [true] }
        '400': { description: 缺少有效修订时间、非活动项目或最后版本需移除角色资产 }
        '404': { description: 项目、角色或版本不存在或不可访问，或版本已归档 }
        '409': { description: 修订已变化、镜头或画布仍引用、任务进行中或引用数据无效；msg 提供处理建议 }
  /projects/{id}/characters/{assetId}/versions/{versionId}/reference-profile:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: assetId, required: true, schema: { type: string } }
      - { in: path, name: versionId, required: true, schema: { type: string } }
    patch:
      tags: [projects]
      summary: 标注角色造型并指定定稿
      description: 按版本更新时间 CAS；同造型定稿与同角色默认唯一。定稿必须有就绪图片。不会重绑旧镜头。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt, profile]
              properties:
                expectedUpdatedAt: { type: string, format: date-time }
                profile: { $ref: '#/components/schemas/CharacterReferenceProfile' }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { description: 标注无效、定稿缺图或项目已归档 }
        '409': { description: 版本已变化 }
  /projects/{id}/characters/{assetId}/looks:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: assetId, required: true, schema: { type: string } }
    post:
      tags: [projects]
      summary: 从指定角色版本创建空图新造型
      description: 返回 data.version；图片需独立补齐并核对后指定定稿。不会继承旧服装图片或定稿资格。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersionId, profile, definition]
              properties:
                baseVersionId: { type: string }
                profile: { $ref: '#/components/schemas/CharacterReferenceProfile' }
                definition: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { description: 基础版本或设定无效、项目已归档 }
        '409': { description: 角色版本变化 }
  /projects/{id}/units/{unitId}/character-references:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: unitId, required: true, schema: { type: string } }
    put:
      tags: [projects]
      summary: 原子更新章节各镜头的角色造型选择
      description: 按项目修订及每镜脚本修订 CAS。自动选择不能覆盖锁定项；生成中镜头拒绝修改。仅替换对应角色的 reference 绑定，保留其他资产与角色。任一项失败整批回滚。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, choices]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 1 }
                choices:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [shotId, assetId, versionId, status, source, locked, reason, expectedShotRevisionId]
                    properties:
                      shotId: { type: string }
                      assetId: { type: string }
                      versionId: { type: string }
                      status: { type: string, enum: [resolved, pending] }
                      source: { type: string, enum: [manual, auto, rule] }
                      locked: { type: boolean }
                      reason: { type: string, minLength: 1, maxLength: 4000 }
                      expectedShotRevisionId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { description: 非法版本、缺图或自动选择了非定稿 }
        '409': { description: 项目/脚本变化、生成中或自动覆盖锁定 }
  /tasks/{id}/stop-local:
    post:
      tags: [tasks]
      summary: 仅停止单条视频任务的本地跟进
      description: |
        仅当前受信任桌面界面可调用。校验当前 owner 与视频任务类型，停止本地等待并清除轮询和租约。
        只接受排队、运行中或已本地停止的任务；不会查询或取消上游，不自动重新生成。
        返回 cancelled 状态并保留原上游任务 ID。上游可能继续生成并计费。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已在本地停止，业务信封 data 为任务记录
        '400':
          description: 不支持的任务类型
        '403':
          description: 非受信任桌面界面或没有资源访问权限
        '404':
          description: 任务不存在
        '409':
          description: 任务已结束或状态已变化
  /projects/{id}/assets:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: 读取项目资产，分页模式支持按集数和分类筛选
      description: |
        提供 page 或 pageSize 时返回分页对象，资产附带 unitIds。
        unitCounts 为全项目各集已确认资产数，空字符串键代表未关联集数；
        categoryCounts、folderCounts 跟随 unitId 范围。归属合并已确认候选来源与镜头绑定，跨集复用不复制资产。
        不传分页参数时返回原有全量 assets 对象。
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 80, default: 40 }
        - in: query
          name: unitId
          description: 仅分页模式使用；省略为全项目，章节 ID 为对应集，__unassigned__ 为未关联集数
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: folderId
          schema: { type: string }
        - in: query
          name: mediaType
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200": { description: 信封 data 为资产列表或含 assets、unitCounts、categoryCounts、folderCounts、page、pageSize、total、hasMore 的分页对象 }
        "404": { description: 项目不存在或不属于当前用户 }
  /volc-asset-library:
    get:
      tags: [assets]
      summary: 读取本地火山 URI 资产记录并自动创建归档目录
      responses:
        "200": { description: 信封 data 为原图与 URI 记录列表 }
        "401": { description: 本地工作区用户未初始化 }
  /resources/{id}/volc-asset:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 使用独立资产上传 Key 同步本地图片并归档原图与 URI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200": { description: 信封 data 为 active 资产绑定，包含 assetId、groupId、uri }
        "400": { description: 上传配置缺失、资源类型错误或远端资产未激活 }
        "404": { description: 本地资源不存在或不属于当前用户 }
  /eggfans/private-avatar:
    post:
      tags: [assets]
      summary: Eggfans 私域素材组、素材 CRUD 及真人认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, operation]
              properties:
                config: { type: object, additionalProperties: true }
                operation: { type: string, enum: [create-group, list-groups, get-group, update-group, delete-group, create-asset, list-assets, get-asset, update-asset, delete-asset, auth-session, group-from-token] }
                id: { type: string }
                body: { type: object, additionalProperties: true }
      responses:
        "200": { description: 信封 data 为上游 Result }
        "400": { description: 参数或上游业务请求失败 }
  /eggfans/video-tasks/query:
    post:
      tags: [tasks]
      summary: 只读查询 Eggfans Seedance 原生或 Volc 视频任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { type: object, additionalProperties: true }
                taskId: { type: string }
                pageSize: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: 信封 data 为上游任务或列表 }
  /resources/{id}/eggfans-private-asset:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [resources]
      summary: 自动上传本地图片、视频或音频并等待私域资产 Active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { type: object, additionalProperties: true }
                body:
                  type: object
                  properties:
                    GroupId: { type: string }
                    Name: { type: string }
      responses:
        "200": { description: 信封 data 为持久化绑定，包含 assetId、groupId、uri、status }
        "404": { description: 资源不存在或不属于当前用户 }
  /resources/{id}/eggfans-private-assets:
    get:
      tags: [resources]
      summary: 读取资源的私域资产绑定，不上传媒体
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 信封 data 为绑定列表 }
        "404": { description: 资源不存在或不属于当前用户 }
  /business/tools:
    get:
      tags: [agent-ops]
      summary: Discover mounted business tools available to external clients
      description: |
        A registered external client uses X-Beeftv-Client and its Bearer token.
        The response lists mounted business handlers and their method, path, query,
        body schemas, readOnly flag, and generation cost hints. External clients
        manage execution approval. Identity, ownership, balance, validation and
        revision checks still run in the existing handlers. Legacy read-only
        credentials cannot execute writes. A listed handler may return
        FeatureUnavailable when its feature is disabled.
      parameters:
        - in: header
          name: X-Beeftv-Client
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          description: Bearer registered-client token
          schema: { type: string }
      responses:
        "200":
          description: Envelope data contains tools, readOnly, authentication and approval
        "403":
          description: Invalid client, forbidden origin or unavailable local identity
  /projects/{id}/chapter-apply-receipts:
    get:
      tags: [projects]
      summary: 查询章节生成结果的持久化写入回执
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: taskIds
          description: 逗号分隔的生成任务 ID，最多 100 个
          schema: { type: string }
      responses:
        "200":
          description: 信封 data.receipts 含 taskId、op、kind、applied；只返回本项目已提交回执
        "404":
          description: 项目不存在或不属于当前用户
        "500":
          description: 回执无法读取，不推断结果已应用
  /creation-conversations:
    get:
      tags: [creation-conversations]
      summary: 列出当前工作区未删除的创作对话
      description: 返回已提交对话文档与墓碑 ID。IndexedDB 不是提交事实。
      responses:
        "200":
          description: 信封 data 为 conversations 与 deletedIds
  /creation-conversations/import:
    post:
      tags: [creation-conversations]
      summary: 按稳定操作标识导入本地历史对话
      description: 仅在没有后端记录或墓碑时导入；同一 operationId 与哈希可重放。
      responses:
        "200":
          description: 信封 data 含 imported 与对话记录
        "409":
          description: 同一操作标识对应不同内容
  /creation-conversations/{id}:
    get:
      tags: [creation-conversations]
      summary: 读取一条未删除的创作对话
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 为 revision 与 document
        "404":
          description: 不存在或已删除
    put:
      tags: [creation-conversations]
      summary: 按 expectedRevision 提交一条创作对话
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 新 revision
        "409":
          description: 版本冲突或墓碑拒绝复活
    delete:
      tags: [creation-conversations]
      summary: 为创作对话写入墓碑
      description: 不删除关联任务或素材。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: expectedRevision
          schema: { type: integer }
      responses:
        "200":
          description: 墓碑已写入
  /beefapi/connection:
    get:
      tags: [beefapi]
      summary: 读取内置 BeefAPI 连接状态
      description: 只返回账号和状态，不含密钥或 device_code。
      responses:
        "200":
          description: 信封 data 为连接摘要
  /beefapi/connection/start:
    post:
      tags: [beefapi]
      summary: 开始企业授权并打开系统浏览器确认页
      responses:
        "200":
          description: 进入 pending 或返回已连接状态
  /beefapi/connection/models:
    post:
      tags: [beefapi]
      summary: 使用当前企业连接刷新并保存模型目录
      description: 不接受客户端密钥或价格；读取上游目录并保存可信能力和报价。连接改变或读取失败时返回错误。
      responses:
        "200":
          description: 信封 data.models 为已保存的上游目录项
  /beefapi/connection/cancel:
    post:
      tags: [beefapi]
      summary: 取消尚未完成的授权
      responses:
        "200":
          description: 当前连接摘要
  /beefapi/connection/disconnect:
    post:
      tags: [beefapi]
      summary: 断开当前连接并吊销本机这把密钥
      responses:
        "200":
          description: 当前连接摘要
  /beefapi/connection/open-wallet:
    post:
      tags: [beefapi]
      summary: 在系统浏览器打开企业充值页 /console/topup
      responses:
        "200":
          description: 已打开
  /canvas-folders:
    get:
      tags: [canvas]
      summary: 列出当前用户的画布文件夹
      responses:
        "200":
          description: 信封 data.folders 为文件夹列表，封面为资源 ID
  /canvas-folders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [canvas]
      summary: 创建或更新画布文件夹
      description: 已删除的文件夹 ID 不能重新导入。封面必须是当前用户已就绪的资源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder:
                  type: object
                  required: [name]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    coverResourceId: { type: string }
      responses:
        "200":
          description: 信封 data.folder 为保存后的文件夹
        "400":
          description: 名称、ID 或封面资源不合法
        "409":
          description: 文件夹已删除，不能用原 ID 重建；本地草稿由前端保留并决定恢复方式
    delete:
      tags: [canvas]
      summary: 删除画布文件夹并清空画布归属
      description: 删除会递增仍指向该文件夹的画布 revision，并更新画布正文中的 folderId。重复删除已删除的文件夹返回成功。
      responses:
        "200":
          description: 信封 data.id 为已删除的文件夹
        "404":
          description: 文件夹不存在或不属于当前用户
  /canvas-projects/{id}/drawings:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 列出画布下的画板摘要（不含快照正文）
      responses:
        "200":
          description: 信封 data.drawings 为画板摘要
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/drawings/{drawingId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: drawingId
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取画板快照与 revision
      responses:
        "200":
          description: 信封 data.drawing 含 snapshot、revision 与预览/成品资源 ID
        "404":
          description: 画布或画板不存在
    put:
      tags: [canvas]
      summary: 按 revision 保存画板快照
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。丢失应答后用同一请求重试会回放已提交结果。已删除的画板不能用原 ID 重新导入；前端应保留可恢复草稿并决定恢复方式，不得自动按原 ID 写回。请求体上限为账号画布和素材数据上限加 JSON 信封余量，写入按同一上限核算字节，没有单独的 8MB 画板上限。预览和成品必须是当前用户已就绪的资源 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drawing]
              properties:
                drawing:
                  type: object
                  required: [revision]
                  properties:
                    drawingId: { type: string }
                    engine: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                    snapshot: { type: object }
                    previewResourceId: { type: string }
                    render:
                      type: object
                      properties:
                        resourceId: { type: string }
      responses:
        "200":
          description: 信封 data.drawing 返回递增后的 revision
        "400":
          description: 画板、引擎或资源引用不合法，或 JSON 无法解析
        "403":
          description: 账号画布和素材数据已达上限
        "409":
          description: 版本冲突，或画板已删除不能用原 ID 重新导入；reason 为 conflict 表示 CAS，failed_precondition 表示已删除。已删除时前端保留可恢复草稿，不自动按原 ID 写回
        "428":
          description: 缺少 revision
    delete:
      tags: [canvas]
      summary: 删除画板快照
      description: 删除写入墓碑并释放预览/成品资源引用。重复删除已删除的画板返回成功。
      responses:
        "200":
          description: 信封 data.id 为已删除的画板
        "404":
          description: 画布或画板不存在
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "404":
          description: 画布不存在或不属于当前用户
    put:
      tags: [canvas]
      summary: 按 revision 保存画布内容
      description: 新建传 revision 0，更新传读取到的版本；成功原子加 1。忽略客户端 viewport 和 remoteContentHash，updatedAt 由服务端生成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: object
                  required: [id, revision]
                  properties:
                    id: { type: string }
                    revision: { type: integer, format: int64, minimum: 0 }
                  additionalProperties: true
      responses:
        "200":
          description: 信封 data.project 返回摘要及递增后的 revision
        "400":
          description: 请求、版本或素材引用不合法
        "409":
          description: 版本或资源状态冲突，原内容未被覆盖；保留草稿后加载最新版
        "428":
          description: 缺少 revision，需刷新客户端并重新读取
  /canvas-projects/{id}/history:
    get:
      tags: [canvas]
      summary: 读取当前画布版本与最近 20 份历史摘要
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 currentRevision 和 snapshots；每项含 id、revision、title、nodeCount、connectionCount、payloadBytes、reason、contentUpdatedAt、createdAt，不含正文
        "404":
          description: 画布不存在或无权访问
  /canvas-projects/{id}/generated-assets:
    put:
      tags: [canvas]
      summary: 原子发布生成素材与画布结果
      description: 按 Resource 精确绑定候选 Asset，并在同一数据库事务中保存 Asset、画布和历史快照；任一步失败均不产生半提交。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, assets]
              properties:
                project:
                  type: object
                  required: [id, revision]
                  additionalProperties: true
                assets:
                  type: array
                  items:
                    type: object
                    required: [id, kind, data]
                    additionalProperties: true
      responses:
        "200":
          description: 信封 data.project 返回递增后的画布 revision
        "400":
          description: 素材、Resource 或画布引用不合法
        "409":
          description: 画布 revision 冲突，Asset 与画布均未提交
  /canvas-projects/{id}/history/{snapshotId}:
    get:
      tags: [canvas]
      summary: 按需读取历史正文
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 信封 data 包含 snapshot 摘要和 project 正文
        "404":
          description: 画布或快照不存在、已过期或无权访问
  /canvas-projects/{id}/history/{snapshotId}/restore:
    post:
      tags: [canvas]
      summary: 备份当前内容并将历史内容恢复为新版本
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 信封 data.project 返回恢复后的摘要及新 revision；当前 ID、归属与项目关联保留
        "404":
          description: 画布或快照不存在、已过期或无权访问
        "409":
          description: 当前版本或素材状态已变化，恢复未执行
        "428":
          description: 缺少当前 revision
  /ops:
    get:
      tags: [agent-ops]
      summary: 列出调用者身份可用的操作描述（含 JSON Schema）
      description: |
        能力模式只由调用者身份决定：已登记客户端的模式来自服务端登记，请求体或查询参数都不能提升权限。
        只读客户端只会拿到 readOnly 操作；写操作在 /ops/{op} 上仍按登记权限强制拒绝。
      responses:
        "200":
          description: 信封 data.ops 为操作描述数组，data.readOnly 表示本次调用的能力模式
        "403":
          description: 非本机同源，或身份不足（缺少已登记客户端凭据与 owner 凭据）
  /ops/{op}:
    post:
      tags: [agent-ops]
      summary: 执行单个操作（CLI、MCP 与内置 pi 会话共用）
      description: |
        写操作必须提供 opId 作为幂等键：同一 opId 同参数回读原结果，不同参数返回冲突。
        写操作还必须在 params 里带上读取时的 expectedRevision：缺少或已过期都会被拒绝，
        不会覆盖别人刚写入的内容。字段落点由画布能力描述符声明（例如生成类节点的可编辑
        提示词落在 metadata.composerContent），操作层不自行拼文档形状。
      parameters:
        - name: op
          in: path
          required: true
          schema:
            type: string
          description: 操作 ID，例如 canvas.get、canvas.nodes.create、canvas.node.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                opId:
                  type: string
                  description: 写操作的幂等键；只读操作不接受该字段
                params:
                  type: object
                  description: 操作参数，形状以 GET /ops 返回的 JSON Schema 为准
      responses:
        "200":
          description: 信封 data 为操作结果；data.replayed=true 表示命中了幂等回放
        "400":
          description: 参数错误；reason=unsupported_field 表示该节点类型没有这个可编辑字段（整批不写）
        "409":
          description: 同一 opId 用于不同请求内容，或 revision 已过期（reason=stale_revision）
        "412":
          description: 缺少读取时的 expectedRevision
        "403":
          description: 只读客户端尝试写操作（reason=read_only_client），或身份不足
  /assistant/status:
    get:
      tags: [assistant]
      security: []
      summary: 内置创作助手宿主状态（免身份、不含凭据）
      responses:
        "200":
          description: 信封 data 为 { available, reason?, url?, health? }；未就绪时给出明确原因
  /assistant/ui-session:
    post:
      tags: [assistant]
      summary: 签发短期限 UI 会话凭据
      description: 需本机同源，并出示 owner 凭据（或本机显式的开发引导开关）。
      responses:
        "200":
          description: 信封 data.token 为绑定当前 owner 的短期限凭据，data.expiresAt 为到期时间；只应保存在内存里并在到期前续签
        "403":
          description: 非本机同源，或既没有 owner 凭据也没有显式本地引导
  /assistant/chat:
    post:
      tags: [assistant]
      summary: 流式对话（NDJSON）
      description: |
        请求头 X-Beeftv-Ui-Session 由 /assistant/ui-session 签发。响应为 NDJSON：
        若干 text_delta 增量，最后恰好一条 turn_end 结算（含 reply、toolCalls、error、cancelled）。
        宿主凭据与模型密钥由后端注入，浏览器不接触。
        X-Beeftv-Turn-Admission 响应头为 rejected（尚未尝试创建业务轮次）、unknown（已尝试创建）或 admitted（已创建）。
        只有 rejected 可以确认未接纳；缺少标记、网络故障或接纳后失败仍需读取回执。续签凭据不会重放消息。
      responses:
        "200":
          description: application/x-ndjson 事件流
        "403":
          description: 缺少或过期的 UI 会话凭据
        "503":
          description: 宿主未配置或不可达（reason=host_token_missing / host_unreachable）
  /assistant/cancel:
    post:
      tags: [assistant]
      summary: 取消指定画布正在进行的回合
      description: 需要写权限，并且 canvasId 必须属于当前工作区。只读客户端不能取消。
      responses:
        "202":
          description: 已受理取消
        "403":
          description: 只读客户端，或缺少写权限
        "404":
          description: 画布不存在或不属于当前工作区，或该画布没有正在进行的会话
  /assistant/host/config:
    get:
      tags: [assistant]
      summary: 读取宿主配置（需 owner 凭据 + 本机同源）
      responses:
        "200":
          description: 信封 data 为 { config, configured, supervisorRunning }
        "403":
          description: 缺少 owner 凭据
    put:
      tags: [assistant]
      summary: 写入宿主配置（当前文本模型与宿主启动命令）
      description: 只写入本机配置文件；启动命令永远不来自请求体。
      responses:
        "200":
          description: 信封 data.config 为写入后的配置
        "403":
          description: 缺少 owner 凭据
  /assistant/host/start:
    post:
      tags: [assistant]
      summary: 启动内置宿主（需 owner 凭据 + 本机同源）
      responses:
        "200":
          description: 信封 data.pid 为本进程启动的宿主进程号
        "503":
          description: 未配置启动命令（reason=host_command_missing）或启动失败
  /assistant/host/stop:
    post:
      tags: [assistant]
      summary: 停止本进程启动的内置宿主
      description: 只停止本进程启动过的子进程；应用关闭时会自动执行同样的清理。
      responses:
        "200":
          description: 信封 data.stopped=true
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /admin/channels/{id}/duplicate:
    post:
      tags: [admin]
      summary: 复制系统渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
